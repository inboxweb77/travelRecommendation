<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TravelBloom - Contact Us</title>
    <link rel="stylesheet" href="style.css">
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- Header / Navbar -->
    <header class="navbar">
        <div class="nav-brand">
            <div class="logo-box">
                <i class="fa-solid fa-plane"></i>
            </div>
            <span class="brand-title">TravelBloom</span>
        </div>

        <nav class="nav-links">
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="contact.html" class="active-link">Contact Us</a>
        </nav>

        <div class="nav-search-container">
            <div class="search-bar">
                <input type="text" placeholder="Enter a destination or keyword" class="search-input">
                <i class="fa-solid fa-magnifying-glass search-icon"></i>
                <button class="btn search-btn">Search</button>
                <button class="btn clear-btn">Clear</button>
            </div>
        </div>
    </header>

    <!-- Contact Section Container -->
    <section class="contact-section">
        <!-- Social Media Sidebar -->
        <div class="social-sidebar">
            <a href="#"><i class="fa-brands fa-twitter"></i></a>
            <a href="#"><i class="fa-brands fa-facebook-f"></i></a>
            <a href="#"><i class="fa-brands fa-instagram"></i></a>
            <a href="#"><i class="fa-brands fa-youtube"></i></a>
        </div>

        <!-- Main Content Layout -->
        <div class="contact-content-wrapper">
            <!-- Left Header Text -->
            <div class="contact-intro">
                <h1 class="page-title">CONTACT US</h1>
                <p class="contact-subtitle">Get in touch</p>
            </div>

            <!-- Right Contact Form -->
            <div class="contact-form-container">
                <form class="contact-form">
                    <div class="form-group">
                        <label for="name">Name</label>
                        <input type="text" id="name" placeholder="Enter your name" required>
                    </div>

                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" placeholder="Enter your email" required>
                    </div>

                    <div class="form-group">
                        <label for="message">Message</label>
                        <textarea id="message" rows="4" placeholder="Enter your message" required></textarea>
                    </div>

                    <button type="submit" class="submit-btn">Submit</button>
                </form>
            </div>
        </div>
    </section>

</body>
</html>
